<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Tres pasos sencillos">
  <rect width="800" height="800" fill="#fef8fa"/>
  <text x="400" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#1f4a32">Solo 3 pasos</text>
  <circle cx="170" cy="260" r="56" fill="#2f6b45"/><text x="170" y="272" text-anchor="middle" font-family="Arial" font-size="34" fill="#fff">1</text>
  <text x="170" y="360" text-anchor="middle" font-family="Arial" font-size="18" fill="#2a2520">2 cápsulas</text>
  <text x="170" y="388" text-anchor="middle" font-family="Arial" font-size="16" fill="#6b6560">con agua</text>
  <circle cx="400" cy="260" r="56" fill="#2f6b45"/><text x="400" y="272" text-anchor="middle" font-family="Arial" font-size="34" fill="#fff">2</text>
  <text x="400" y="360" text-anchor="middle" font-family="Arial" font-size="18" fill="#2a2520">Con las comidas</text>
  <text x="400" y="388" text-anchor="middle" font-family="Arial" font-size="16" fill="#6b6560">todos los días</text>
  <circle cx="630" cy="260" r="56" fill="#2f6b45"/><text x="630" y="272" text-anchor="middle" font-family="Arial" font-size="34" fill="#fff">3</text>
  <text x="630" y="360" text-anchor="middle" font-family="Arial" font-size="18" fill="#2a2520">Disfruta</text>
  <text x="630" y="388" text-anchor="middle" font-family="Arial" font-size="16" fill="#6b6560">más comodidad</text>
  <rect x="120" y="470" width="560" height="220" rx="18" fill="#fff" stroke="#ecd9e2" stroke-width="2"/>
  <text x="400" y="530" text-anchor="middle" font-family="Arial" font-size="20" fill="#1f4a32">60 cápsulas = 30 días de suministro</text>
  <text x="400" y="570" text-anchor="middle" font-family="Arial" font-size="17" fill="#6b6560">Dosis: 2 cápsulas al día con agua</text>
</svg>