<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Glutatión, Niacinamida y NAG">
  <rect width="800" height="800" fill="#faf9fc"/>
  <circle cx="400" cy="360" r="180" fill="#ebe3f7" stroke="#c9b8e0" stroke-width="3"/>
  <text x="400" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#5b3d8f">Triple acción</text>
  <text x="250" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#8b6fc0">Glutatión</text>
  <text x="400" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#8b6fc0">Niacinamida</text>
  <text x="550" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#8b6fc0">NAG</text>
  <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#6a6070">Cuidado localizado para el tono desigual</text>
