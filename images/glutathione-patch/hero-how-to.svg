<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Cómo usar los parches">
  <rect width="800" height="800" fill="#f3eef9"/>
  <text x="400" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#5b3d8f">3 pasos sencillos</text>
  <circle cx="200" cy="320" r="70" fill="#8b6fc0"/><text x="200" y="330" text-anchor="middle" fill="#fff" font-size="36" font-family="Arial">1</text>
  <text x="200" y="420" text-anchor="middle" font-family="Arial" font-size="18" fill="#5b3d8f">Limpia</text>
  <circle cx="400" cy="320" r="70" fill="#8b6fc0"/><text x="400" y="330" text-anchor="middle" fill="#fff" font-size="36" font-family="Arial">2</text>
  <text x="400" y="420" text-anchor="middle" font-family="Arial" font-size="18" fill="#5b3d8f">Coloca</text>
  <circle cx="600" cy="320" r="70" fill="#8b6fc0"/><text x="600" y="330" text-anchor="middle" fill="#fff" font-size="36" font-family="Arial">3</text>
