<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Parches partibles para cuidado localizado">
  <rect width="800" height="800" fill="#f3eef9"/>
  <text x="400" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#5b3d8f">Parches partibles</text>
  <g transform="translate(400 420)">
    <rect x="-180" y="-120" width="360" height="240" rx="20" fill="#fff" stroke="#c9b8e0" stroke-width="3"/>
    <rect x="-150" y="-90" width="140" height="100" rx="12" fill="#d9ccf0"/>
    <rect x="10" y="-90" width="140" height="100" rx="12" fill="#c8b5e8"/>
    <rect x="-150" y="20" width="140" height="100" rx="12" fill="#b8a3dc"/>
    <rect x="10" y="20" width="140" height="100" rx="12" fill="#a892d4"/>
    <line x1="0" y1="-90" x2="0" y2="120" stroke="#8b6fc0" stroke-width="2" stroke-dasharray="8 6"/>
    <line x1="-150" y1="15" x2="150" y2="15" stroke="#8b6fc0" stroke-width="2" stroke-dasharray="8 6"/>
  </g>
  <text x="400" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#6a6070">Adapta el parche a la zona que quieres cuidar</text>
</svg>
